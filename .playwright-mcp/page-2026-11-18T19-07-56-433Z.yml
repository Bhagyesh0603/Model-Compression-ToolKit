        - paragraph [ref=e33]: Pipeline
        - heading "Five stages in a fixed order" [level=1] [ref=e34]
        - paragraph [ref=e35]: Every stage exports an ONNX file and is measured, so the result is a table of real numbers per stage rather than one number out of a black box. If latency got worse, you can see which stage did it.
