              - paragraph [ref=e65]: Stage 5
              - paragraph [ref=e66]: Verify
              - paragraph [ref=e67]: Export to ONNX and measure accuracy and latency on that file.
      - generic [ref=e71]:
        - heading "Why quantization is last" [level=2] [ref=e72]
        - paragraph [ref=e74]: Quantization changes the weight type from float to integer. After that, structural pruning no longer applies and gradient-based fine-tuning is blocked. The pipeline refuses a plan where quantize is not the final stage, instead of reordering it silently.
