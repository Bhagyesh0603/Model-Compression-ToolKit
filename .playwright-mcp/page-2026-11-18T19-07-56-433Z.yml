              - paragraph [ref=e46]: Prune
              - paragraph [ref=e47]: Remove channels through the dependency graph, widths aligned for SIMD.
          - listitem [ref=e48]:
            - link [ref=e49] [cursor=pointer]:
              - /url: /techniques/recalibration
              - paragraph [ref=e50]: Stage 2
              - paragraph [ref=e51]: Recover
              - paragraph [ref=e52]: Re-estimate BatchNorm statistics, then fine-tune against the original as teacher.
          - listitem [ref=e53]:
            - link [ref=e54] [cursor=pointer]:
