    - main [ref=f1e30]:
      - generic [ref=f1e32]:
        - paragraph [ref=f1e33]: Pipeline
        - heading "Choose the stages your model needs" [level=1] [ref=f1e34]
        - paragraph [ref=f1e35]: The stages below show a typical manual workflow, not a mandatory sequence. QAT and distillation are optional. Every executed compression stage exports an ONNX file and is measured, so the result is a table of real numbers rather than one number out of a black box. If latency got worse, you can see which stage did it.
      - generic [ref=f1e37]:
        - heading "The stages" [level=2] [ref=f1e40]
        - list [ref=f1e42]:
          - listitem [ref=f1e43]:
            - link [ref=f1e44] [cursor=pointer]:
              - /url: /techniques/pruning
              - paragraph [ref=f1e45]: 1. Compression option
              - paragraph [ref=f1e46]: Prune
              - paragraph [ref=f1e47]: Remove channels through the dependency graph, widths aligned for SIMD.
          - listitem [ref=f1e48]:
            - link [ref=f1e49] [cursor=pointer]:
              - /url: /techniques/recalibration
              - paragraph [ref=f1e50]: 2. Compression option
              - paragraph [ref=f1e51]: Recover
              - paragraph [ref=f1e52]: Re-estimate BatchNorm statistics with forward passes; no weight training.
          - listitem [ref=f1e53]:
            - link [ref=f1e54] [cursor=pointer]:
              - /url: /techniques/distillation
              - paragraph [ref=f1e55]: 3. Compression option
              - paragraph [ref=f1e56]: Distill
              - paragraph [ref=f1e57]: Optional extra distillation epochs once the architecture is final.
          - listitem [ref=f1e58]:
            - link [ref=f1e59] [cursor=pointer]:
              - /url: /techniques/quantization
              - paragraph [ref=f1e60]: 4. Compression option
              - paragraph [ref=f1e61]: QAT
              - paragraph [ref=f1e62]: Optionally train with simulated rounding error before final quantization.
          - listitem [ref=f1e63]:
            - link [ref=f1e64] [cursor=pointer]:
              - /url: /techniques/quantization
              - paragraph [ref=f1e65]: 5. Compression option
              - paragraph [ref=f1e66]: Quantize
              - paragraph [ref=f1e67]: INT8 where the CPU has fast INT8, FP16 where it does not. Always last.
          - listitem [ref=f1e68]:
            - link [ref=f1e69] [cursor=pointer]:
              - /url: /techniques/benchmarking
              - paragraph [ref=f1e70]: 6. Measurement
              - paragraph [ref=f1e71]: Verify
              - paragraph [ref=f1e72]: Export to ONNX and measure accuracy and latency on that file.
      - generic [ref=f1e76]:
        - heading "Why quantization is last" [level=2] [ref=f1e77]
        - paragraph [ref=f1e79]: Final quantization produces a deployment artifact rather than a trainable PyTorch model. In this toolkit, structural pruning and gradient-based recovery must happen before that export. The pipeline refuses a plan where quantize is not the final stage, instead of reordering it silently.
